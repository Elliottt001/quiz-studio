server {
    listen 443 ssl;
    server_name quiz.campus.example.edu.cn;

    # Use a publicly trusted certificate obtained with DNS-01 validation.
    ssl_certificate /etc/letsencrypt/live/quiz.campus.example.edu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.campus.example.edu.cn/privkey.pem;

    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
