name: Platform tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quiz_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quiz_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/quiz_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:platform
      - run: npm run build:platform
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run check
      - run: npm run build
